# Projet généré avec XcodeGen : `xcodegen generate` recrée TeslaMirror.xcodeproj.
# Pour signer : renseignez DEVELOPMENT_TEAM et, si besoin, BUNDLE_ID_PREFIX ci-dessous.
name: TeslaMirror
options:
  bundleIdPrefix: com.teslamirror
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    BUNDLE_ID_PREFIX: com.teslamirror
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  TeslaMirror:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - target: TeslaMirrorBroadcast
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TeslaMirror
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TeslaMirror
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: TeslaMirror affiche l'état du serveur de recopie d'écran local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # Le bundle ID DOIT être celui de l'app + ".Broadcast" (utilisé par RPSystemBroadcastPickerView).
  TeslaMirrorBroadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).TeslaMirror.Broadcast
        SKIP_INSTALL: YES
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: TeslaMirror
        NSLocalNetworkUsageDescription: TeslaMirror diffuse l'écran vers le navigateur de la voiture sur le réseau local.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
